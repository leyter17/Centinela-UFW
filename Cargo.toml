[package]
name = "ufw-sentinel"
version = "1.3.0"
edition = "2021"
rust-version = "1.80"
authors = ["Leyter Vázquez . V"]
description = "Centinela UFW — administrador gráfico del firewall UFW, simple y profesional"
license = "GPL-3.0-only"
repository = "https://www.gnu.org/licenses/gpl-3.0.html"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
ksni = { version = "0.3.7", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
regex = "1"
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
